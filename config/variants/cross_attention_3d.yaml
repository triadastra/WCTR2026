# Variant: Axial cross-attention by dimension (S4ND-style 3d)
# Attends separately along each lattice axis:
#   2d -> State; 3d -> State+Commodity; 4d -> State+Commodity+Flow
# dims is derived from the variant name in make_gru/make_lstm.
# Information protocol matches s4nd_3d: State and Commodity are structural, so
# only Flow is re-injected as an embedding (base.yaml: 2 — the same width as
# s4nd_3d's `encoder_extra_dim: 2`). Identical to the matched_axial_3d alias.

model:
  variant: cross_attention_3d
  categorical_protocol: matched_s4nd

  cross_attention:
    dropout: 0.0

# Do not add a 'data:' block here (an empty one parses as None and wipes base).
