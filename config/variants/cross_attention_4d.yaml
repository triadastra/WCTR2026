# Variant: Axial cross-attention by dimension (S4ND-style 4d)
# Attends separately along each lattice axis:
#   2d -> State; 3d -> State+Commodity; 4d -> State+Commodity+Flow
# dims is derived from the variant name in make_gru/make_lstm.
# Information protocol matches s4nd_4d: State, Commodity and Flow are all
# structural, so no identity embedding is appended. Identical to the
# matched_axial_4d alias.

model:
  variant: cross_attention_4d
  categorical_protocol: matched_s4nd

  cross_attention:
    dropout: 0.0

# Do not add a 'data:' block here (an empty one parses as None and wipes base).
